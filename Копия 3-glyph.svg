<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Авторский древний глиф</title>
  <desc id="desc">Симметричный магический знак с центральным кристаллом и раскрывающимися вверх крыльями.</desc>
  <g stroke="#302117" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
    <!-- Парные крылья, раскрывающиеся от центрального кристалла -->
    <path d="M256 360c-34-20-70-39-101-64-34-27-59-58-59-94 0-38 26-67 60-67 42 0 72 42 100 98 28-56 58-98 100-98 34 0 60 29 60 67 0 36-25 67-59 94-31 25-67 44-101 64Z"/>
    <!-- Внутренние линии-перья -->
    <path d="M226 315c-34-27-68-55-81-88-8-19-4-34 8-42 18-11 39 5 57 34"/>
    <path d="M286 315c34-27 68-55 81-88 8-19 4-34-8-42-18-11-39 5-57 34"/>
    <!-- Центральный знак восхождения -->
    <path d="M256 164v41"/>
    <path d="m256 197 39 49-39 81-39-81 39-49Z" fill="#c4954d"/>
    <path d="m256 226 17 20-17 38-17-38 17-20Z" fill="#f1d495" stroke="none"/>
    <circle cx="256" cy="246" r="6" fill="#302117" stroke="none"/>
    <!-- Верхняя искра -->
    <path d="m256 93 13 14-13 14-13-14 13-14Z" fill="#c4954d"/>
    <path d="M256 121v29"/>
  </g>
  <g fill="#c4954d">
    <circle cx="129" cy="254" r="7"/>
    <circle cx="383" cy="254" r="7"/>
  </g>
</svg>
